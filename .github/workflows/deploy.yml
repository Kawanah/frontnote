name: Déploiement → O2switch

# Push sur main : tests, compilation, envoi FTP dans apps/frontnote/, redémarrage.
# Tant que les secrets FTP ne sont pas configurés, rien n'est envoyé.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploiement

jobs:
  deploiement:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Compiler et préparer le paquet
        run: bun run paquet

      - name: Envoyer sur O2switch (FTPS)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./deploy/frontnote/
          server-dir: apps/frontnote/

      - name: Secrets FTP absents
        if: env.FTP_SERVER == ''
        run: echo "::warning::Secrets FTP non configurés : compilation et tests OK, rien n'a été envoyé."
