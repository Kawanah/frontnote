name: Déploiement → O2switch

# Push sur main : tests, compilation, envoi FTP dans apps/frontnote/, redémarrage.
# Tant que les secrets FTP ne sont pas configurés, rien n'est envoyé.
# Pull request : mêmes vérifications, jamais d'envoi.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une mise en ligne à la fois ; les vérifications de PR ne la bloquent pas
concurrency: deploiement-${{ github.ref }}

jobs:
  deploiement:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run typecheck

      - name: Compiler et préparer le paquet
        run: bun run paquet

      - name: Vérifier le serveur compilé (garde-fous de sécurité)
        run: bun run verif:serveur

      - name: Envoyer sur O2switch (FTPS)
        if: github.event_name != 'pull_request' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./deploy/frontnote/
          server-dir: apps/frontnote/

      - name: Secrets FTP absents
        if: github.event_name != 'pull_request' && env.FTP_SERVER == ''
        run: |
          echo "::warning::Secrets FTP non configurés, compilation et tests OK, rien n'a été envoyé."
